<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TTK AI Chat - Cyberpunk</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/github-dark.min.css">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --bg-dark:#0a0a0f;
  --bg-light:#f5f5f5;
  --text-dark:#e0f7ff;
  --text-light:#0d1117;
  --accent:#00ffcc;
  --accent-hover:#00e6a4;
  --bubble-ai-dark:#101218;
  --bubble-user-dark:#005f5f;
  --bubble-ai-light:#e9e9eb;
  --bubble-user-light:#4bd37f;
  --glitch-color:#ff00ff;
}
*{box-sizing:border-box;}
body{
  margin:0;
  font-family:'Share Tech Mono','Orbitron',monospace,sans-serif;
  background: var(--bg-dark);
  color: var(--text-dark);
  height:100vh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  position:relative;
  transition:0.6s;
  perspective:1000px;
}

/* Hình nền gradient 3D Cyberpunk */
body::before{
  content:"";
  position:absolute;
  width:300%;
  height:300%;
  background: radial-gradient(circle at 30% 30%, #00ffcc44, transparent),
              radial-gradient(circle at 70% 70%, #ff00ff33, transparent),
              radial-gradient(circle at 50% 50%, #00ffff33, transparent),
              linear-gradient(45deg, #ff008844, #00ff8844, #0088ff33);
  filter: blur(180px);
  transform: translate3d(0,0,0);
  transition: transform 0.1s;
  z-index:0;
}

/* Header với Glitch mạnh hơn */
header{
  padding:15px 25px;
  background: rgba(15,15,25,0.95);
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:2px solid #30363d;
  border-radius:0;
  z-index:1;
  position:relative;
  text-shadow: 0 0 5px var(--accent), 0 0 15px var(--glitch-color);
  animation: glitch-header 1s infinite linear alternate-reverse;
}
header span{font-size:0.9em;opacity:0.7;color:#ccc;text-shadow: 0 0 3px var(--accent);}
@keyframes glitch-header{
  0%{text-shadow:0 0 5px var(--accent);}
  25%{text-shadow:2px 1px 10px var(--glitch-color);}
  50%{text-shadow:-2px -1px 15px var(--accent-hover);}
  75%{text-shadow:1px 0 8px var(--glitch-color);}
  100%{text-shadow:0 0 5px var(--accent);}
}

.mode-toggle{
  background:none;
  border:none;
  color:inherit;
  font-size:1.5em;
  cursor:pointer;
  transition:0.3s;
  text-shadow: 0 0 3px var(--accent);
}
.mode-toggle:hover{
  transform:rotate(25deg);
  text-shadow:0 0 10px var(--accent),0 0 20px #ff00ff;
}

/* Messages */
#messages{
  flex:1;
  overflow-y:auto;
  padding:20px;
  scroll-behavior:smooth;
  display:flex;
  flex-direction:column;
  gap:12px;
  z-index:1;
  position:relative;
}
#messages::-webkit-scrollbar{width:10px;}
#messages::-webkit-scrollbar-track{background:#000;}
#messages::-webkit-scrollbar-thumb{
  background:linear-gradient(45deg,#00ffcc,#ff00ff);
  border-radius:5px;
}

/* Bubble + animation + Neon/Glass + Scanline */
.message{
  display:flex;
  max-width:75%;
  opacity:0;
  transform:translateY(20px);
  animation: fade-glitch 0.6s forwards;
  position:relative;
  transition:0.3s;
}
.message.user{align-self:flex-end;justify-content:flex-end;}
.message.ai{align-self:flex-start;justify-content:flex-start;}
.bubble{
  padding:14px 18px;
  border-radius:15px 5px 15px 5px; /* góc cạnh */
  word-wrap:break-word;
  line-height:1.5;
  white-space:pre-wrap;
  display:flex;
  flex-direction:column;
  gap:8px;
  backdrop-filter:blur(15px) saturate(200%);
  border:1px solid rgba(0,255,255,0.3);
  position:relative;
  transition:0.2s, box-shadow 0.3s, transform 0.3s;
  overflow:hidden;
  text-shadow:0 0 2px #00ffcc;
}
.user .bubble{background:rgba(0,95,95,0.5);color:#fff;}
.ai .bubble{
  background:rgba(16,18,24,0.6);
  color:var(--text-dark);
  background-image: repeating-linear-gradient(
    0deg,
    rgba(255,255,255,0.02),
    rgba(255,255,255,0.02) 1px,
    transparent 1px,
    transparent 2px
  ); /* scanline */
}
.bubble::before{
  content:"";
  position:absolute;
  top:0; left:0;
  width:100%; height:100%;
  pointer-events:none;
  background: radial-gradient(circle at 50% 50%, rgba(0,255,255,0.1), transparent 60%);
  mix-blend-mode:screen;
  transform:translate(0,0);
  transition: transform 0.1s;
}
.bubble.glow{
  box-shadow: 0 0 20px var(--accent),
              0 0 40px var(--accent-hover),
              0 0 60px var(--glitch-color),
              0 0 80px var(--accent);
  transform: scale(1.05);
}
.bubble.glitch::after{
  content: attr(data-text);
  position:absolute;
  top:0; left:2px;
  width:100%; color:var(--glitch-color);
  text-shadow:-1px 0 var(--accent),1px 0 var(--accent-hover);
  animation: glitch 1s infinite linear alternate-reverse;
  opacity:0.6;
}

.typing{font-style:italic;opacity:0.7;}
@keyframes fade-glitch{
  0%{opacity:0;transform:translateY(20px) skewX(-2deg);}
  50%{opacity:0.5;transform:translateY(0) skewX(1deg);}
  100%{opacity:1;transform:translateY(0) skewX(0);}
}
@keyframes glitch{
  0%{transform:translate(0,0);}
  20%{transform:translate(-1px,1px);}
  40%{transform:translate(1px,-1px);}
  60%{transform:translate(-1px,-1px);}
  80%{transform:translate(1px,1px);}
  100%{transform:translate(0,0);}
}

/* Avatar */
.avatar{
  width:40px;
  height:40px;
  border-radius:50%;
  margin-right:10px;
  flex-shrink:0;
  box-shadow: 0 4px 15px var(--accent);
  transition: transform 0.3s, box-shadow 0.3s;
}
.message.ai .avatar{background:#00ffcc url('https://i.ibb.co/7pF0g1R/robot.png') center/cover no-repeat;}
.message.user .avatar{background:#005f5f url('https://i.ibb.co/Y0w6nLc/user.png') center/cover no-repeat;}
.message.ai .avatar:hover,
.message.user .avatar:hover{
  transform: scale(1.15) rotate(-5deg);
  box-shadow: 0 6px 25px var(--accent-hover);
}

/* Chat input */
.chat-input{
  display:flex;
  padding:14px;
  gap:10px;
  background: rgba(15,15,25,0.95);
  border-top:2px solid #30363d;
  border-radius:0; /* nhọn */
  z-index:1;
  position:relative;
}
.chat-input input[type="text"]{
  flex:1;
  padding:14px;
  border-radius:0;
  border:1px solid rgba(0,255,255,0.3);
  background: rgba(0,0,0,0.6);
  color: #e0f7ff;
  font-family:'Share Tech Mono','Orbitron',monospace;
  font-size:1em;
  outline:none;
  transition:0.3s, box-shadow 0.3s;
}
.chat-input input[type="text"]:focus{
  box-shadow: 0 0 15px var(--accent),0 0 30px var(--glitch-color);
  border-color: var(--accent);
}
.send-btn{
  padding:12px 20px;
  border:none;
  border-radius:0; /* nhọn */
  background: linear-gradient(135deg,var(--accent),var(--accent-hover));
  color:#0a0a0f;
  font-weight:bold;
  cursor:pointer;
  font-family:'Orbitron','Share Tech Mono',monospace;
  transition:0.3s, box-shadow 0.3s;
  text-shadow:0 0 5px #00ffcc;
}
.send-btn:hover{
  background: linear-gradient(135deg,var(--accent-hover),#ff00ff);
  box-shadow:0 0 20px var(--accent-hover),0 0 40px #ff00ff;
}
.icon-btn{
  background:none;border:none;font-size:1.5em;color:var(--accent);cursor:pointer;
  transition:0.3s,text-shadow 0.3s;
}
.icon-btn:hover{text-shadow:0 0 10px var(--accent),0 0 25px #ff00ff;}
.file-input{display:none;}
.image-preview{
  width:70px;height:70px;border-radius:12px;object-fit:cover;border:2px solid var(--accent);cursor:pointer;position:relative;
  transition:0.3s, box-shadow 0.3s;
}
.image-preview:hover{
  box-shadow:0 0 15px var(--accent),0 0 25px #ff00ff;
}
.image-preview:hover::after{
  content:"✖";position:absolute;top:-6px;right:-6px;background:white;color:red;border-radius:50%;font-size:0.8em;padding:0 3px;
}

/* Light mode */
body.light{background:var(--bg-light);color:var(--text-light);}
body.light .ai .bubble{background:var(--bubble-ai-light);color:var(--text-light);}
body.light .user .bubble{background:var(--bubble-user-light);}
body.light .chat-input input{background:#fff;color:#000;}
</style>
</head>
<body>
<header>
  🤖 TTK AI <span>Dev by Trần Tuấn Khang</span>
  <button class="mode-toggle" id="modeToggle">🌓</button>
</header>
<div id="messages"></div>
<div class="chat-input">
  <button class="icon-btn" id="imgBtn">🖼️</button>
  <input type="file" id="fileInput" class="file-input" accept="image/*" multiple>
  <input type="text" id="input" placeholder="Nhập tin nhắn hoặc mô tả ảnh...">
  <button id="send" class="send-btn">Gửi</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
<script>
// === GIỮ NGUYÊN TOÀN BỘ LOGIC JS HIỆN TẠI ===
const API_KEY="AIzaSyCrzfPbVtDLKBAsdKO31vdHysBb8JDQYUU";
const MODEL="gemini-2.0-flash";
const endpoint=`https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${API_KEY}`;
const messagesDiv=document.getElementById("messages");
const input=document.getElementById("input");
const sendBtn=document.getElementById("send");
const modeToggle=document.getElementById("modeToggle");
const imgBtn=document.getElementById("imgBtn");
const fileInput=document.getElementById("fileInput");
let selectedImages=[];
document.addEventListener("mousemove", e=>{
  const x = e.clientX/window.innerWidth*30;
  const y = e.clientY/window.innerHeight*30;
  document.body.style.setProperty('--bg-offset-x', `${x}px`);
  document.body.style.setProperty('--bg-offset-y', `${y}px`);
  document.body.querySelector('::before')?.style && (document.body.querySelector('::before').style.transform = `translate3d(${-x}px, ${-y}px,0)`);
  document.querySelectorAll('.bubble').forEach(b=>{
    const rect=b.getBoundingClientRect();
    const cx=e.clientX-(rect.left+rect.width/2);
    const cy=e.clientY-(rect.top+rect.height/2);
    const dist=Math.sqrt(cx*cx+cy*cy);
    if(dist<150){b.classList.add('glow');} else {b.classList.remove('glow');}
    b.style.setProperty('--shineX', `${cx}px`);
    b.style.setProperty('--shineY', `${cy}px`);
    b.querySelector('::before')?.style && (b.querySelector('::before').style.transform=`translate(${cx*0.05}px,${cy*0.05}px)`);
  });
});
function renderMessageContent(text){
  const container=document.createElement("div");
  container.innerHTML=marked.parse(text);
  container.querySelectorAll('pre code').forEach(el=>hljs.highlightElement(el));
  return container;
}
function addMessage(text,sender,isTyping=false,images=[]){
  const msg=document.createElement("div");
  msg.className=`message ${sender}`;
  const avatar=document.createElement("div");
  avatar.className="avatar";
  msg.appendChild(avatar);
  const bubble=document.createElement("div");
  bubble.className="bubble";
  images.forEach(src=>{
    const img=document.createElement("img");
    img.src=src; img.className="image-preview";
    img.onclick=()=>{selectedImages=selectedImages.filter(s=>s!==src); img.remove();};
    bubble.appendChild(img);
  });
  bubble.appendChild(renderMessageContent(text));
  if(isTyping) bubble.classList.add("typing");
  msg.appendChild(bubble);
  messagesDiv.appendChild(msg);
  messagesDiv.scrollTop=messagesDiv.scrollHeight;
  return msg;
}
imgBtn.onclick=()=>fileInput.click();
fileInput.onchange=e=>{
  Array.from(e.target.files).forEach(file=>{
    const reader=new FileReader();
    reader.onload=()=>{selectedImages.push(reader.result); addMessage("", "user", false,[reader.result]);};
    reader.readAsDataURL(file);
  });
};
document.addEventListener("paste",e=>{
  for(let i=0;i<e.clipboardData.items.length;i++){
    if(e.clipboardData.items[i].type.indexOf("image")!==-1){
      const file=e.clipboardData.items[i].getAsFile();
      const reader=new FileReader();
      reader.onload=()=>{selectedImages.push(reader.result); addMessage("", "user", false,[reader.result]);};
      reader.readAsDataURL(file);
    }
  }
});
async function sendMessage(){
  const text=input.value.trim();
  if(!text && selectedImages.length===0) return;
  addMessage(text||"📷 Ảnh","user",false,selectedImages);
  input.value="";
  const typingMsg=addMessage("TTK AI đang gõ...","ai",true);
  try{
    const parts=[];
    selectedImages.forEach(img=>parts.push({inline_data:{mime_type:"image/png",data:img.split(",")[1]}}));
    if(text) parts.push({text});
    const res=await fetch(endpoint,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({contents:[{parts}]})});
    const data=await res.json();
    typingMsg.remove();
    const reply=data?.candidates?.[0]?.content?.parts?.[0]?.text || "⚠️ Không có phản hồi từ AI.";
    addMessage(reply,"ai");
  }catch(err){
    typingMsg.remove();
    addMessage("❌ Lỗi kết nối hoặc key không hợp lệ.","ai");
  }
  selectedImages=[];
}
sendBtn.onclick=sendMessage;
input.addEventListener("keypress",e=>{if(e.key==="Enter") sendMessage();});
modeToggle.onclick=()=>document.body.classList.toggle("light");
addMessage("Xin chào 👋! Mình là **TTK AI** – trợ lý ảo của bạn. Hãy gửi tin nhắn hoặc ảnh để mình giúp nhé!","ai");
</script>
</body>
</html>
