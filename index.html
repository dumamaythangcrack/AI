<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TTK AI Chat - Gemini 2.5 Flash + Imagen 3.0</title>

<!-- Highlight.js & Marked.js -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

<style>
:root{
  --bg:#0b0b10; --text:#f0f0f0; --accent:#a855f7; --bubble-ai:rgba(25,25,25,0.7);
  --bubble-user:rgba(50,50,50,0.6); --modal-bg:rgba(15,15,15,0.9);
}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;margin:0;}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;background:rgba(20,20,20,0.5);backdrop-filter:blur(10px);}
header h1{font-family:'Orbitron',monospace;font-size:1.1em;margin:0;}
header button{background:none;border:none;color:var(--text);cursor:pointer;font-size:1.2em;margin-left:10px;}
#messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth;}
.message{display:flex;max-width:75%;animation:fadeIn .3s ease forwards;}
.message.user{align-self:flex-end;}
.message.ai{align-self:flex-start;}
.bubble{padding:14px 18px;border-radius:14px;line-height:1.5;white-space:pre-wrap;}
.ai .bubble{background:var(--bubble-ai);border-left:3px solid var(--accent);}
.user .bubble{background:var(--bubble-user);}
.chat-input{display:flex;gap:8px;padding:14px;background:rgba(20,20,20,0.5);backdrop-filter:blur(10px);}
.chat-input input{flex:1;padding:12px;border-radius:10px;border:none;outline:none;background:rgba(255,255,255,0.08);color:var(--text);}
.send-btn{padding:12px 20px;border:none;border-radius:10px;background:var(--accent);color:white;font-family:'Orbitron';cursor:pointer;}
/* Sidebar lịch sử */
#historySidebar{position:fixed;top:0;left:-300px;width:280px;height:100%;background:rgba(20,20,25,0.95);color:var(--text);transition:.4s;overflow-y:auto;padding:20px;}
#historySidebar.show{left:0;}
#historySidebar h2{font-family:'Orbitron';font-size:1em;margin-bottom:10px;}
.session-item{padding:10px;background:rgba(255,255,255,0.05);border-radius:8px;margin-bottom:8px;cursor:pointer;transition:.2s;}
.session-item:hover{background:rgba(255,255,255,0.1);}
#infoModal{position:fixed;inset:0;display:flex;justify-content:center;align-items:center;background:rgba(0,0,0,0.6);opacity:0;pointer-events:none;transition:.3s;}
#infoModal.show{opacity:1;pointer-events:auto;}
#infoModal .modal{background:var(--modal-bg);padding:20px 30px;border-radius:16px;text-align:center;}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
</style>
</head>
<body>

<header>
  <h1>🤖 TTK AI Chat</h1>
  <div>
    <button id="historyBtn">☰</button>
    <button id="modeToggle">🌓</button>
    <button id="infoBtn">ℹ️</button>
  </div>
</header>

<div id="messages"></div>

<div class="chat-input">
  <input id="userInput" placeholder="Nhập tin nhắn hoặc lệnh /image...">
  <button id="sendBtn" class="send-btn">Gửi</button>
</div>

<!-- Sidebar Lịch sử -->
<aside id="historySidebar">
  <h2>Lịch sử hội thoại</h2>
  <button id="newChatBtn" class="send-btn" style="width:100%;margin-bottom:10px;">Bắt đầu mới</button>
  <div id="sessionList"></div>
</aside>

<!-- Info Modal -->
<div id="infoModal">
  <div class="modal">
    <h3>TTK AI Chat</h3>
    <p>Mô hình Chat: Gemini 2.5 Flash (Streaming)</p>
    <p>Mô hình Ảnh: Imagen 3.0</p>
    <button id="closeInfo" class="send-btn" style="margin-top:10px;">Đóng</button>
  </div>
</div>

<script>
/* === Config === */
const API_KEY = "YOUR_GEMINI_API_KEY";
const GEMINI_STREAM_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:streamGenerateContent?key=${API_KEY}`;
const IMAGE_ENDPOINT = `https://generativelanguage.googleapis.com/v1beta/models/imagen-3.0-generate-002:generateImages?key=${API_KEY}`;
const SYSTEM_INSTRUCTION_VISION = "Bạn là chuyên gia phân tích thị giác AI. Hãy phân tích hình ảnh chi tiết, có chiều sâu, sử dụng Markdown.";

/* === Global Variables === */
let chatHistory = [];
let allSessions = JSON.parse(localStorage.getItem("allSessions")) || {};
let currentSessionId = Date.now().toString();

/* === UI Elements === */
const messagesDiv = document.getElementById("messages");
const input = document.getElementById("userInput");
const sendBtn = document.getElementById("sendBtn");
const sidebar = document.getElementById("historySidebar");
const historyBtn = document.getElementById("historyBtn");
const sessionList = document.getElementById("sessionList");
const newChatBtn = document.getElementById("newChatBtn");

/* === Helper === */
function saveCurrentSession(){
  allSessions[currentSessionId] = {
    sessionId: currentSessionId,
    title: chatHistory[0]?.parts?.[0]?.text?.slice(0,50) || "Phiên mới",
    messages: chatHistory
  };
  localStorage.setItem("allSessions", JSON.stringify(allSessions));
}
function loadSession(id){
  currentSessionId = id;
  chatHistory = allSessions[id].messages || [];
  messagesDiv.innerHTML = "";
  chatHistory.forEach(msg=>{
    addMessage(msg.parts[0].text, msg.role);
  });
}
function renderSessions(){
  sessionList.innerHTML = "";
  Object.values(allSessions).reverse().forEach(s=>{
    const div=document.createElement("div");
    div.className="session-item";
    div.textContent=s.title;
    div.onclick=()=>{loadSession(s.sessionId);toggleSidebar(false);};
    sessionList.appendChild(div);
  });
}
function startNewChat(){
  chatHistory=[]; messagesDiv.innerHTML="";
  currentSessionId = Date.now().toString();
}

/* === Message Rendering === */
function addMessage(text, sender){
  const msg=document.createElement("div");
  msg.className=`message ${sender}`;
  const bubble=document.createElement("div");
  bubble.className="bubble";
  bubble.innerHTML = marked.parse(text);
  msg.appendChild(bubble);
  messagesDiv.appendChild(msg);
  messagesDiv.scrollTop = messagesDiv.scrollHeight;
  return bubble;
}

/* === Streaming Response === */
async function streamChatResponse(prompt){
  const aiBubble = addMessage("...", "ai");
  const body = JSON.stringify({
    contents:[...chatHistory, {role:"user", parts:[{text:prompt}]}]
  });

  const res = await fetch(GEMINI_STREAM_URL, {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body
  });

  const reader = res.body.getReader();
  const decoder = new TextDecoder("utf-8");
  let buffer="";
  aiBubble.innerHTML="";
  while(true){
    const {done,value}=await reader.read();
    if(done) break;
    buffer += decoder.decode(value,{stream:true});
    const lines = buffer.split("\n");
    for(const line of lines){
      if(line.startsWith("data: ")){
        const json=line.slice(6);
        if(json.trim()==="") continue;
        try{
          const obj=JSON.parse(json);
          const token=obj?.candidates?.[0]?.content?.parts?.[0]?.text || "";
          aiBubble.innerHTML += token.replace(/\n/g,"<br>");
          messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }catch{}
      }
    }
  }
  chatHistory.push({role:"user",parts:[{text:prompt}]});
  chatHistory.push({role:"model",parts:[{text:aiBubble.textContent}]});
  saveCurrentSession();
}

/* === Image Generation === */
async function generateImage(prompt){
  addMessage(`🎨 Tạo ảnh cho: "${prompt}"`,"user");
  const aiBubble = addMessage("Đang tạo ảnh...","ai");
  const res = await fetch(IMAGE_ENDPOINT,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({prompt})
  });
  const data = await res.json();
  const base64 = data?.images?.[0]?.data;
  if(base64){
    aiBubble.innerHTML = `<img src="data:image/png;base64,${base64}" style="max-width:100%;border-radius:10px;">`;
  } else aiBubble.innerHTML = "⚠️ Không tạo được ảnh.";
}

/* === Chat Logic === */
async function handleSend(){
  const text=input.value.trim();
  if(!text) return;
  input.value="";
  if(text.startsWith("/taoanh")||text.startsWith("/image")||text.startsWith("/imagine")){
    const prompt=text.split(" ").slice(1).join(" ");
    generateImage(prompt);
    return;
  }
  await streamChatResponse(text);
}

/* === Events === */
sendBtn.onclick=handleSend;
input.addEventListener("keypress",e=>{if(e.key==="Enter")handleSend();});
historyBtn.onclick=()=>toggleSidebar();
newChatBtn.onclick=startNewChat;

/* === Sidebar Toggle === */
function toggleSidebar(force){
  sidebar.classList.toggle("show",force);
  renderSessions();
}

/* === Info Modal === */
const infoModal=document.getElementById("infoModal");
document.getElementById("infoBtn").onclick=()=>infoModal.classList.add("show");
document.getElementById("closeInfo").onclick=()=>infoModal.classList.remove("show");

/* === Init === */
renderSessions();
addMessage("Xin chào! 👋 Đây là **TTK AI Chat** (Gemini 2.5 + Imagen 3.0). Hãy bắt đầu trò chuyện!","ai");
</script>
</body>
</html>
