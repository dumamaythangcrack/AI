<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TTK AI Chat V2.0 - Professional Edition</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/github-dark.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Orbitron:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --bg-dark:#0a0a0f;
  --bg-light:#f9f9f9;
  --text-dark:#e0e0e0;
  --text-light:#111;
  --accent:#a855f7;
  --accent-hover:#b366ff;
  --bubble-ai-dark:rgba(30,30,30,0.75);
  --bubble-user-dark:rgba(50,50,50,0.55);
  --bubble-ai-light:rgba(245,245,245,0.85);
  --bubble-user-light:rgba(220,220,220,0.8);
  --modal-bg: rgba(20,20,20,0.7);
  --sidebar-bg-dark: rgba(25, 25, 30, 0.9);
  --sidebar-bg-light: rgba(250, 250, 250, 0.9);
  --btn-disabled: #555;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:'Inter',sans-serif;
  background: var(--bg-dark);
  color: var(--text-dark);
  height:100vh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  position:relative;
  transition:0.5s background ease,color 0.5s;
}
body::before{
  content:"";
  position:absolute;
  width:100%;
  height:100%;
  background: rgba(15,15,15,0.4);
  filter: blur(50px);
  transform: translate3d(0,0,0);
  z-index:0;
}

/* === Splash Screen (Giữ nguyên) === */
#splashScreen{
  position: fixed;
  top:0; left:0;
  width:100%; height:100%;
  background: var(--bg-dark);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:9999;
  opacity:1;
  transition: opacity 0.8s ease;
}
#splashScreen.hidden{opacity:0;pointer-events:none;}
#splashScreen .ai-spinner{
  display:flex;
  align-items:center;
  gap:10px;
}
#splashScreen .ai-spinner .spinner{
  width:30px;
  height:30px;
  border:4px solid rgba(255,255,255,0.2);
  border-top:4px solid var(--accent);
  border-radius:50%;
  animation: spin 1s linear infinite;
}
#splashScreen span{
  font-size:1.1em;
  color: var(--text-dark);
  font-weight:500;
  margin-top:10px;
}
@keyframes spin{
  0%{transform:rotate(0deg);}
  100%{transform:rotate(360deg);}
}

/* === Spinner Bubble AI (Giữ nguyên) === */
.message.ai .ai-spinner{
  display:flex;
  align-items:center;
  gap:6px;
}
.message.ai .ai-spinner .spinner{
  width:20px;
  height:20px;
  border:2px solid rgba(255,255,255,0.2);
  border-top:2px solid var(--accent);
  border-radius:50%;
  animation: spin 1s linear infinite;
}
.message.ai .ai-spinner span{
  font-size:0.85em;
  color: var(--text-dark);
}

/* === Header (Nâng cấp) === */
header{
  padding:15px 25px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background: rgba(20,20,20,0.5);
  backdrop-filter: blur(12px);
  border-radius:12px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.2);
  position:relative;
  z-index:1;
  transition: all 0.4s ease;
}
header .logo-area { display: flex; align-items: center; gap: 15px; }
header .logo-area span{ font-size:0.9em; opacity:0.7; color: var(--text-dark);}
.header-btn{ background:none; border:none; color:inherit; font-size:1.5em; cursor:pointer; transition:all 0.3s ease; margin-left:10px;}
.header-btn:hover{ transform:scale(1.05);}

/* === Khung Chat (Nâng cấp) === */
#messages{ flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:14px; z-index:1; position:relative; scroll-behavior:smooth;}
#messages::-webkit-scrollbar{width:8px;}
#messages::-webkit-scrollbar-track{background:transparent;}
#messages::-webkit-scrollbar-thumb{ background: var(--accent); border-radius:8px;}
.message{ display:flex; max-width:75%; opacity:0; transform:translateY(20px) scale(0.95); animation: slide-up 0.5s ease-out forwards; position:relative;}
.message.user{align-self:flex-end;}
.message.ai{align-self:flex-start;}
.bubble{ padding:16px 20px; word-wrap:break-word; line-height:1.5; white-space:pre-wrap; display:flex; flex-direction:column; gap:8px; backdrop-filter:blur(12px); background: var(--bubble-ai-dark); border-radius:12px; position:relative; transition:0.3s; overflow:hidden;}
.user .bubble{ background:var(--bubble-user-dark); color: var(--text-dark);}
.ai .bubble{ padding:20px 25px; border-radius:16px 16px 16px 4px; background: var(--bubble-ai-dark); border-left: 3px solid var(--accent);}
/* Nâng cấp CSS cho Marked.js & Highlight.js */
.ai .bubble p { margin-bottom: 10px; }
.ai .bubble ul, .ai .bubble ol { margin-left: 20px; margin-bottom: 10px; }
.ai .bubble pre { 
  background: rgba(0,0,0,0.5); /* Nền tối hơn cho code */
  border-left: 3px solid var(--accent); 
  border-radius:6px; 
  padding:14px; 
  overflow-x:auto; 
  font-family:'Share Tech Mono','Orbitron',monospace; 
  color: #f8f8f2; /* Màu text sáng cho highlight.js */
  margin: 10px 0;
}
.ai .bubble code:not(pre code) { 
  background: rgba(50,50,50,0.5); /* Nền cho inline code */
  border-radius:4px; 
  padding:2px 6px; 
  font-family:'Share Tech Mono','Orbitron',monospace; 
  color:var(--accent);
}
.bubble::before{ content:""; position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.02), transparent 70%); mix-blend-mode:screen; transition: transform 0.2s ease;}
.avatar{ width:42px; height:42px; border-radius:50%; margin-right:10px; flex-shrink:0; transition: transform 0.3s;}
.message.ai .avatar{background:#a855f7 url('https://i.ibb.co/dsCLWn26/images.jpg') center/cover no-repeat;}
.message.user .avatar{background:#555 url('https://i.ibb.co/PsYbWjjR/png-clipart-aspria-fitness-computer-icons-user-my-account-icon-miscellaneous-monochrome-thumbnail.png') center/cover no-repeat;}
.message.ai .avatar:hover,.message.user .avatar:hover{ transform: scale(1.1);}
/* Ảnh preview trong bubble */
.bubble .image-preview {
  width: 100%;
  max-width: 300px;
  height: auto;
  border-radius: 8px;
  border: 1px solid rgba(255,255,255,0.2);
}
/* Ảnh do AI tạo ra */
.bubble .generated-image {
  width: 100%;
  max-width: 512px;
  height: auto;
  border-radius: 12px;
  border: 2px solid var(--accent);
}

/* === Input (Nâng cấp) === */
.chat-input{ display:flex; padding:14px; gap:10px; background: rgba(20,20,20,0.5); backdrop-filter: blur(12px); border-radius:16px; position:relative; z-index:1; flex-direction: column;}
.chat-input-main { display: flex; gap: 10px; width: 100%; }
.chat-input input[type="text"]{ flex:1; padding:14px; border-radius:12px; border:none; background: rgba(255,255,255,0.08); color: var(--text-dark); font-family:'Inter',sans-serif; font-size:1em; outline:none; transition:0.3s;}
.chat-input input[type="text"]:focus{ box-shadow: 0 0 6px var(--accent); background: rgba(255,255,255,0.12);}
.send-btn{ padding:12px 22px; border:none; border-radius:12px; background: var(--accent); color:#fff; font-weight:bold; cursor:pointer; font-family:'Orbitron','Share Tech Mono',monospace; transition:0.3s;}
.send-btn:hover{ box-shadow:0 0 6px var(--accent);}
.icon-btn{ background:none;border:none;font-size:1.5em;color:var(--accent);cursor:pointer;transition:0.3s;}
.icon-btn:hover{ text-shadow:0 0 6px var(--accent);}
/* Vô hiệu hóa nút */
.send-btn:disabled, .icon-btn:disabled {
  background: var(--btn-disabled);
  color: #999;
  cursor: not-allowed;
  opacity: 0.6;
}
.icon-btn:disabled { background: none; }
.chat-input input[type="text"]:disabled { background: rgba(100,100,100,0.2); }

.file-input{display:none;}
/* Vùng preview ảnh (Mới) */
#imagePreviewContainer {
  display: flex;
  gap: 10px;
  padding: 0 5px 10px 5px;
  overflow-x: auto;
}
#imagePreviewContainer .preview-item {
  position: relative;
  flex-shrink: 0;
}
#imagePreviewContainer img {
  width: 70px;
  height: 70px;
  border-radius: 12px;
  object-fit: cover;
  border: 2px solid var(--accent);
  transition: 0.3s;
}
#imagePreviewContainer .remove-img-btn {
  position: absolute;
  top: -5px;
  right: -5px;
  background: #000;
  color: #fff;
  border: 1px solid #fff;
  border-radius: 50%;
  width: 20px;
  height: 20px;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
  display: flex;
  justify-content: center;
  align-items: center;
  line-height: 1;
}

@keyframes slide-up{0%{opacity:0;transform:translateY(20px) scale(0.95);}100%{opacity:1;transform:translateY(0) scale(1);}}

/* === Info Modal (Giữ nguyên) === */
#infoModal{ position:fixed;top:0;left:0;width:100%;height:100%; background: rgba(0,0,0,0.5); display:flex;justify-content:center;align-items:center; opacity:0;pointer-events:none;transition:0.3s; z-index:10;}
#infoModal.show{ opacity:1;pointer-events:auto;}
#infoModal .modal-content{ background: var(--modal-bg); backdrop-filter: blur(12px); padding:20px 30px; border-radius:16px; max-width:400px; text-align:center; color: var(--text-dark); position:relative;}
#infoModal .modal-content h2{margin-bottom:10px;font-family:'Orbitron',monospace;}
#infoModal .modal-content p{margin:6px 0;}
#infoModal .close-btn{ position:absolute;top:10px;right:15px; background:none;border:none;color:var(--text-dark);font-size:1.5em;cursor:pointer;}

/* === History Sidebar (Mới) === */
#historySidebar {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.5);
  display: flex;
  justify-content: center;
  align-items: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
  z-index: 100;
}
#historySidebar.show {
  opacity: 1;
  pointer-events: auto;
}
.history-modal-content {
  background: var(--sidebar-bg-dark);
  backdrop-filter: blur(12px);
  width: 90%;
  max-width: 450px;
  max-height: 70vh;
  border-radius: 16px;
  display: flex;
  flex-direction: column;
  box-shadow: 0 4px 30px rgba(0,0,0,0.3);
  position: relative;
  color: var(--text-dark);
}
.history-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px 20px;
  border-bottom: 1px solid rgba(255,255,255,0.1);
}
.history-header h2 { font-family: 'Orbitron', monospace; }
.history-header .close-btn { background: none; border: none; color: inherit; font-size: 1.8em; cursor: pointer; }
.history-header .new-chat-btn {
  background: var(--accent);
  color: #fff;
  border: none;
  padding: 8px 12px;
  border-radius: 8px;
  cursor: pointer;
  font-weight: 500;
  transition: 0.3s;
}
.history-header .new-chat-btn:hover { background: var(--accent-hover); }
#historyList {
  flex: 1;
  overflow-y: auto;
  padding: 10px;
}
#historyList .session-item {
  display: block;
  width: 100%;
  text-align: left;
  background: rgba(255,255,255,0.05);
  border: none;
  color: var(--text-dark);
  padding: 12px 15px;
  border-radius: 8px;
  margin-bottom: 8px;
  cursor: pointer;
  transition: 0.3s;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
#historyList .session-item:hover {
  background: rgba(255,255,255,0.1);
}
#historyList .session-item.active {
  background: var(--accent);
  color: #fff;
  font-weight: bold;
}

/* === Chế độ Sáng (Nâng cấp) === */
body.light{ background:var(--bg-light); color:var(--text-light);}
body.light .ai .bubble{background:var(--bubble-ai-light);color:var(--text-light);}
body.light .user .bubble{background:var(--bubble-user-light);}
body.light .chat-input input{background:rgba(0,0,0,0.05);color:#111;}
body.light .chat-input input:focus{background:rgba(0,0,0,0.08);}
body.light header, body.light .chat-input { background: rgba(245,245,245,0.5); }
body.light header span { color: var(--text-light); }
body.light .ai .bubble pre { background: rgba(230,230,230,0.8); color: #333; }
body.light .ai .bubble code:not(pre code) { background: rgba(220,220,220,0.7); }
body.light #infoModal .modal-content { background: var(--sidebar-bg-light); color: var(--text-light); }
body.light #historySidebar .history-modal-content { background: var(--sidebar-bg-light); color: var(--text-light); }
body.light #historyList .session-item { background: rgba(0,0,0,0.05); color: var(--text-light); }
body.light #historyList .session-item:hover { background: rgba(0,0,0,0.1); }
body.light #historyList .session-item.active { background: var(--accent); color: #fff; }
body.light .send-btn:disabled, body.light .icon-btn:disabled { background: #ccc; color: #888; }
body.light .icon-btn:disabled { background: none; }
</style>
</head>
<body>

<div id="splashScreen">
  <div class="ai-spinner">
    <div class="spinner"></div>
    <span>Đang load hệ thống Base64...</span>
  </div>
</div>

<header>
  <div class="logo-area">
    <button class="header-btn" id="historyBtn">☰</button>
    <span>🤖 TTK AI V2.0</span>
  </div>
  <div>
    <button class="header-btn" id="modeToggle">🌓</button>
    <button class="header-btn" id="infoBtn">ℹ️</button>
  </div>
</header>

<div id="messages"></div>

<div class="chat-input">
  <div id="imagePreviewContainer"></div>
  <div class="chat-input-main">
    <button class="icon-btn" id="imgBtn" title="Chèn ảnh">🖼️</button>
    <input type="file" id="fileInput" class="file-input" accept="image/*" multiple>
    
    <button class="icon-btn" id="generateImgBtn" title="Tạo ảnh (dùng /taoanh, /image, /imagine)">🎨</button>
    
    <input type="text" id="input" placeholder="Nhập tin nhắn hoặc '/taoanh' để tạo ảnh...">
    <button id="send" class="send-btn">Gửi</button>
  </div>
</div>

<div id="infoModal">
  <div class="modal-content">
    <button class="close-btn" id="closeModal">&times;</button>
    <h2>TTK AI V2.0</h2>
    <p><strong>Mô hình nền tảng:</strong> Gemini 1.5 Flash</p>
    <p><strong>Tính năng:</strong> Streaming, Vision, Image Gen, Session</p>
    <p><strong>Developer:</strong> Trần Tuấn Khang</p>
  </div>
</div>

<div id="historySidebar">
  <div class="history-modal-content">
    <div class="history-header">
      <h2>Lịch sử Chat</h2>
      <button class="new-chat-btn" id="newChatBtn">+ Chat Mới</button>
      <button class="close-btn" id="closeHistoryModal">&times;</button>
    </div>
    <div id="historyList">
      </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
<script>
// === KHAI BÁO BIẾN TOÀN CỤC VÀ HẰNG SỐ ===

// API Key (Theo yêu cầu)
const API_KEY = "AIzaSyCrzfPbVtDLKBAsdKO31vdHysBb8JDQYUU";

// Model và Endpoints
const MODEL = "gemini-1.5-flash-latest"; // Sử dụng model 1.5 Flash mới nhất
// Endpoint cho streaming (đáp ứng yêu cầu streaming token-by-token)
const STREAM_ENDPOINT = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:streamGenerateContent?key=${API_KEY}&alt=sse`;
// Endpoint tạo ảnh (Theo yêu cầu)
const IMAGE_ENDPOINT = `https://generativelanguage.googleapis.com/v1beta/models/imagen-3.0-generate-002:generateImages?key=${API_KEY}`;

// Chỉ thị hệ thống cho Vision (Theo yêu cầu)
const SYSTEM_INSTRUCTION_VISION = "Bạn là một chuyên gia phân tích thị giác AI. Khi nhận được hình ảnh, hãy phân tích nó một cách siêu chi tiết, cấu trúc, và chuyên nghiệp. Phân tích ngữ cảnh, ý nghĩa, và mối liên hệ sâu sắc. Phản hồi phải chuẩn xác, có chiều sâu, và chia thành các đoạn văn rõ ràng sử dụng Markdown.";

// Quản lý State
let allSessions = {}; // Lưu trữ tất cả phiên
let currentSessionId = null; // ID của phiên hiện tại
let chatHistory = []; // Lịch sử chat của phiên hiện tại
let selectedImages = []; // { src, data, mime_type }

// DOM Elements
const messagesDiv = document.getElementById("messages");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
const modeToggle = document.getElementById("modeToggle");
const imgBtn = document.getElementById("imgBtn");
const fileInput = document.getElementById("fileInput");
const generateImgBtn = document.getElementById("generateImgBtn"); // Mới
const previewContainer = document.getElementById("imagePreviewContainer"); // Mới

// DOM Elements - Modals
const splashScreen = document.getElementById("splashScreen");
const infoBtn = document.getElementById("infoBtn");
const infoModal = document.getElementById("infoModal");
const closeModal = document.getElementById("closeModal");
const historyBtn = document.getElementById("historyBtn"); // Mới
const historySidebar = document.getElementById("historySidebar"); // Mới
const closeHistoryModal = document.getElementById("closeHistoryModal"); // Mới
const newChatBtn = document.getElementById("newChatBtn"); // Mới
const historyList = document.getElementById("historyList"); // Mới

// === KHỞI TẠO ỨNG DỤNG ===

window.addEventListener("load", () => {
  // Logic Splash Screen
  setTimeout(() => {
    splashScreen.classList.add("hidden");
    setTimeout(() => {
      splashScreen.style.display = "none";
      initApp(); // Khởi tạo ứng dụng sau khi splash ẩn
    }, 800);
  }, 2000); // Giữ splash 2 giây
});

/**
 * Khởi tạo ứng dụng, tải session từ localStorage
 */
function initApp() {
  // Cấu hình Marked.js
  marked.setOptions({
    breaks: true, // Thêm <br> khi xuống dòng
    gfm: true, // Bật GitHub Flavored Markdown
  });
  
  // Tải sessions
  const storedSessions = localStorage.getItem('chatSessions');
  if (storedSessions) {
    allSessions = JSON.parse(storedSessions);
  }
  
  // Tải session cuối cùng hoặc tạo mới
  const lastSessionId = localStorage.getItem('lastSessionId');
  if (lastSessionId && allSessions[lastSessionId]) {
    loadSession(lastSessionId);
  } else {
    startNewChat();
  }
  
  renderHistorySidebar();
}

// === QUẢN LÝ PHIÊN HỘI THOẠI (Yêu cầu 1) ===

/**
 * Bắt đầu một phiên chat mới
 */
function startNewChat() {
  saveCurrentSession(); // Lưu phiên hiện tại trước khi tạo mới
  
  const newSessionId = `session_${Date.now()}`;
  currentSessionId = newSessionId;
  chatHistory = [];
  
  // Tạo session mới
  allSessions[newSessionId] = {
    sessionId: newSessionId,
    title: "Chat Mới",
    messages: []
  };
  
  messagesDiv.innerHTML = ""; // Xóa tin nhắn cũ
  addMessage("Xin chào 👋! Mình là **TTK AI** – trợ lý ảo của bạn. Hãy gửi tin nhắn, ảnh, hoặc dùng lệnh `/taoanh` để tạo ảnh nhé!","ai");
  
  chatHistory.push({
    role: "model",
    parts: [{ text: "Xin chào 👋! Mình là **TTK AI** – trợ lý ảo của bạn. Hãy gửi tin nhắn, ảnh, hoặc dùng lệnh `/taoanh` để tạo ảnh nhé!" }]
  });
  
  saveCurrentSession(); // Lưu session mới
  localStorage.setItem('lastSessionId', currentSessionId);
  renderHistorySidebar();
  if (historySidebar.classList.contains('show')) {
    historySidebar.classList.remove('show');
  }
}

/**
 * Tải một phiên chat từ sessionId
 * @param {string} sessionId - ID của phiên cần tải
 */
function loadSession(sessionId) {
  if (!allSessions[sessionId]) return;
  
  saveCurrentSession(); // Lưu phiên hiện tại
  
  currentSessionId = sessionId;
  chatHistory = allSessions[sessionId].messages;
  
  messagesDiv.innerHTML = ""; // Xóa tin nhắn
  
  // Render lại tất cả tin nhắn từ lịch sử
  chatHistory.forEach(msg => {
    const text = msg.parts.find(p => p.text)?.text || "";
    const images = msg.parts
      .filter(p => p.inline_data)
      .map(p => `data:${p.inline_data.mime_type};base64,${p.inline_data.data}`);
      
    addMessage(text, msg.role === 'user' ? 'user' : 'ai', images);
  });
  
  localStorage.setItem('lastSessionId', currentSessionId);
  renderHistorySidebar();
  historySidebar.classList.remove('show');
  scrollToBottom(true);
}

/**
 * Lưu phiên chat hiện tại vào allSessions và localStorage
 */
function saveCurrentSession() {
  if (!currentSessionId || !allSessions[currentSessionId]) return;
  
  // Tự động tạo tiêu đề từ tin nhắn đầu tiên của người dùng
  if (allSessions[currentSessionId].title === "Chat Mới") {
    const firstUserMsg = chatHistory.find(m => m.role === 'user');
    if (firstUserMsg) {
      const firstText = firstUserMsg.parts.find(p => p.text)?.text;
      if (firstText) {
        allSessions[currentSessionId].title = firstText.substring(0, 30) + (firstText.length > 30 ? "..." : "");
      } else if (firstUserMsg.parts.some(p => p.inline_data)) {
        allSessions[currentSessionId].title = "📷 Phân tích ảnh";
      }
    }
  }
  
  allSessions[currentSessionId].messages = chatHistory;
  localStorage.setItem('chatSessions', JSON.stringify(allSessions));
}

/**
 * Render lại danh sách phiên chat trong sidebar
 */
function renderHistorySidebar() {
  historyList.innerHTML = ""; // Xóa danh sách cũ
  
  const sortedSessions = Object.values(allSessions).sort((a, b) => {
    // Trích xuất timestamp từ sessionId
    const timeA = parseInt(a.sessionId.split('_')[1] || 0);
    const timeB = parseInt(b.sessionId.split('_')[1] || 0);
    return timeB - timeA; // Sắp xếp mới nhất lên đầu
  });

  sortedSessions.forEach(session => {
    const item = document.createElement("button");
    item.className = "session-item";
    item.textContent = session.title;
    item.dataset.sessionId = session.sessionId;
    
    if (session.sessionId === currentSessionId) {
      item.classList.add("active");
    }
    
    item.onclick = () => loadSession(session.sessionId);
    historyList.appendChild(item);
  });
}

// === XỬ LÝ CHÍNH (Gửi tin nhắn, API) ===

/**
 * Hàm gửi tin nhắn chính (Triggered by Send Button or Enter)
 */
async function sendMessage() {
  const text = input.value.trim();
  
  // Kiểm tra nếu không có text và không có ảnh
  if (!text && selectedImages.length === 0) return;
  
  // Vô hiệu hóa input (Yêu cầu 4)
  toggleInputActive(false);
  
  // Xác định chế độ tạo ảnh (Yêu cầu 3)
  const isImageGen = text.startsWith('/taoanh') || text.startsWith('/image') || text.startsWith('/imagine');
  let prompt = text;
  if (isImageGen) {
    prompt = text.replace(/\/taoanh|\/image|\/imagine/, '').trim();
    if (!prompt) {
      addMessage("Vui lòng nhập mô tả cho ảnh sau lệnh /taoanh.", "ai");
      toggleInputActive(true);
      return;
    }
  }

  // 1. Chuẩn bị `parts` cho tin nhắn người dùng
  const userParts = [];
  selectedImages.forEach(img => {
    userParts.push({
      inline_data: {
        mime_type: img.mime_type,
        data: img.data
      }
    });
  });
  if (text) {
    userParts.push({ text: text });
  }

  // 2. Thêm tin nhắn người dùng vào UI và Lịch sử
  addMessage(text, "user", selectedImages.map(img => img.src));
  chatHistory.push({ role: "user", parts: userParts });
  
  // 3. Dọn dẹp input
  input.value = "";
  selectedImages = [];
  previewContainer.innerHTML = "";

  // 4. Lưu phiên ngay sau khi người dùng gửi
  saveCurrentSession();
  renderHistorySidebar(); // Cập nhật title nếu là tin nhắn đầu
  
  // 5. Tạo bubble "typing" của AI
  const aiMsgBubble = addMessage("", "ai").querySelector('.bubble');
  aiMsgBubble.innerHTML = createSpinner(isImageGen ? "🎨 Đang vẽ..." : "Đang suy nghĩ...");
  scrollToBottom(true);
  
  // 6. Gọi API
  try {
    if (isImageGen) {
      // Chế độ tạo ảnh (Yêu cầu 3)
      await handleImageGeneration(prompt, aiMsgBubble);
    } else {
      // Chế độ chat/vision (Yêu cầu 2)
      await handleChatStream(aiMsgBubble);
    }
  } catch (err) {
    // Xử lý lỗi chung (Yêu cầu 2)
    aiMsgBubble.innerHTML = `❌ Lỗi API: ${err.message}. Vui lòng thử lại.`;
  }
  
  // 7. Kích hoạt lại input và lưu lần cuối
  toggleInputActive(true);
  saveCurrentSession();
}

/**
 * Xử lý gọi API tạo ảnh (Yêu cầu 3)
 * @param {string} prompt - Mô tả ảnh
 * @param {HTMLElement} bubbleEl - Bubble của AI để cập nhật
 */
async function handleImageGeneration(prompt, bubbleEl) {
  bubbleEl.querySelector('span').textContent = "🎨 Đang vẽ... (có thể mất 1-2 phút)";
  
  const res = await fetch(IMAGE_ENDPOINT, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ 
      prompt: prompt,
      number_of_images: 1, // Yêu cầu 1 ảnh
      response_format: "b64_json" // Yêu cầu Base64
    })
  });
  
  if (!res.ok) {
    const errorData = await res.json();
    throw new Error(errorData.error?.message || `Lỗi HTTP ${res.status}`);
  }
  
  const data = await res.json();
  const b64Json = data.images?.[0]?.b64_json;
  
  if (!b64Json) {
    throw new Error("Không nhận được dữ liệu ảnh từ API.");
  }
  
  const imgSrc = `data:image/png;base64,${b64Json}`;
  
  // Hiển thị ảnh
  bubbleEl.innerHTML = `<img src="${imgSrc}" class="generated-image" alt="Ảnh do AI tạo: ${prompt}">`;
  
  // Lưu vào lịch sử
  chatHistory.push({
    role: "model",
    parts: [{
      inline_data: {
        mime_type: "image/png",
        data: b64Json
      }
    }]
  });
}

/**
 * Xử lý gọi API chat streaming (Yêu cầu 2)
 * @param {HTMLElement} bubbleEl - Bubble của AI để cập nhật
 */
async function handleChatStream(bubbleEl) {
  let fullResponse = "";
  let buffer = "";
  const decoder = new TextDecoder();
  
  // Chuẩn bị payload
  const payload = {
    contents: chatHistory,
    generationConfig: {
      temperature: 0.7,
      topK: 1,
      topP: 1,
      maxOutputTokens: 2048,
    },
    // Thêm chỉ thị hệ thống nếu có ảnh (Yêu cầu 3)
    ...(chatHistory[chatHistory.length - 1].parts.some(p => p.inline_data) && {
      systemInstruction: { parts: [{ text: SYSTEM_INSTRUCTION_VISION }] }
    })
  };
  
  const res = await fetch(STREAM_ENDPOINT, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  });
  
  if (!res.ok) {
    const errorData = await res.json();
    throw new Error(errorData.error?.message || `Lỗi HTTP ${res.status}`);
  }

  // Xử lý stream SSE
  const reader = res.body.getReader();
  bubbleEl.innerHTML = ""; // Xóa spinner để bắt đầu stream
  
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    
    buffer += decoder.decode(value, { stream: true });
    const lines = buffer.split('\n');
    buffer = lines.pop(); // Giữ lại dòng cuối (có thể chưa hoàn chỉnh)
    
    for (const line of lines) {
      if (line.startsWith('data: ')) {
        try {
          const jsonString = line.substring(6);
          const parsed = JSON.parse(jsonString);
          const textChunk = parsed.candidates?.[0]?.content?.parts?.[0]?.text;
          
          if (textChunk) {
            fullResponse += textChunk;
            // Render Markdown + con trỏ "▌" (Yêu cầu 4 - Marked.js)
            bubbleEl.innerHTML = marked.parse(fullResponse + ' ▌'); 
            // Tối ưu hóa cuộn (Yêu cầu 4)
            scrollToBottom(false);
          }
        } catch (e) {
          // Bỏ qua lỗi parse JSON (do chunk không hoàn chỉnh)
          // console.warn("Lỗi parse SSE chunk:", e.message, line);
        }
      }
    }
  }
  
  // Xử lý buffer còn lại (nếu có)
  if (buffer.startsWith('data: ')) {
     try {
        const jsonString = buffer.substring(6);
        const parsed = JSON.parse(jsonString);
        const textChunk = parsed.candidates?.[0]?.content?.parts?.[0]?.text;
        if (textChunk) fullResponse += textChunk;
     } catch (e) {}
  }

  // Render hoàn chỉnh và tô sáng code (Yêu cầu 4)
  bubbleEl.innerHTML = marked.parse(fullResponse);
  bubbleEl.querySelectorAll('pre code').forEach((block) => {
    hljs.highlightElement(block);
  });
  
  // Lưu vào lịch sử
  chatHistory.push({
    role: "model",
    parts: [{ text: fullResponse }]
  });
  scrollToBottom(true); // Cuộn xuống cuối
}

// === CÁC HÀM TIỆN ÍCH (UI, Helpers) ===

/**
 * Thêm tin nhắn vào giao diện
 * @param {string} text - Nội dung (Markdown)
 * @param {string} sender - 'user' hoặc 'ai'
 * @param {string[]} images - Mảng các src (data URL) của ảnh
 * @returns {HTMLElement} - Element tin nhắn vừa tạo
 */
function addMessage(text, sender, images = []) {
  const msg = document.createElement("div");
  msg.className = `message ${sender}`;
  
  const avatar = document.createElement("div");
  avatar.className = "avatar";
  msg.appendChild(avatar);
  
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  
  // Thêm ảnh (nếu có)
  images.forEach(src => {
    const img = document.createElement("img");
    img.src = src;
    img.className = "image-preview";
    bubble.appendChild(img);
  });

  // Render text (Sử dụng Marked.js - Yêu cầu 4)
  if (text) {
    const textContent = document.createElement('div');
    textContent.className = 'text-content';
    // Sử dụng marked.parse để chuyển Markdown sang HTML
    textContent.innerHTML = marked.parse(text);
    bubble.appendChild(textContent);
    
    // Áp dụng highlight.js cho các khối code
    textContent.querySelectorAll('pre code').forEach((block) => {
      hljs.highlightElement(block);
    });
  }
  
  msg.appendChild(bubble);
  messagesDiv.appendChild(msg);
  
  // Đợi DOM update và cuộn xuống
  setTimeout(() => {
    msg.style.opacity = 1; // Animation (thay vì class 'show')
    msg.style.transform = 'translateY(0) scale(1)';
    scrollToBottom(true);
  }, 50);

  return msg;
}

/**
 * Xử lý preview ảnh khi người dùng chọn/dán
 * @param {File} file - Đối tượng File
 * @param {string} src - Data URL của ảnh
 */
function previewImage(file, src) {
  const base64Data = src.split(',')[1];
  const imageId = `img_${Date.now()}_${Math.random()}`;
  
  const imgData = {
    id: imageId,
    src: src,
    data: base64Data,
    mime_type: file.type
  };
  selectedImages.push(imgData);
  
  // Tạo item preview
  const previewItem = document.createElement('div');
  previewItem.className = 'preview-item';
  previewItem.dataset.id = imageId;
  
  const imgEl = document.createElement('img');
  imgEl.src = src;
  
  const removeBtn = document.createElement('button');
  removeBtn.className = 'remove-img-btn';
  removeBtn.innerHTML = '&times;';
  
  // Xử lý xóa ảnh khỏi preview
  removeBtn.onclick = () => {
    selectedImages = selectedImages.filter(img => img.id !== imageId);
    previewItem.remove();
  };
  
  previewItem.appendChild(imgEl);
  previewItem.appendChild(removeBtn);
  previewContainer.appendChild(previewItem);
}

/**
 * Bật/tắt các nút input (Yêu cầu 4)
 * @param {boolean} isActive - True để bật, False để tắt
 */
function toggleInputActive(isActive) {
  input.disabled = !isActive;
  sendBtn.disabled = !isActive;
  imgBtn.disabled = !isActive;
  generateImgBtn.disabled = !isActive;
}

/**
 * Tạo HTML cho spinner
 * @param {string} text - Nội dung text cạnh spinner
 */
function createSpinner(text = "Processing...") {
  return `
    <div class="ai-spinner">
      <div class="spinner"></div>
      <span>${text}</span>
    </div>
  `;
}

// === Tối ưu hóa Cuộn (Yêu cầu 4) ===

/**
 * Kiểm tra xem người dùng có đang ở gần cuối màn hình chat không
 * @returns {boolean}
 */
function isUserNearBottom() {
  const threshold = 150; // 150px
  const pos = messagesDiv.scrollTop + messagesDiv.clientHeight;
  const height = messagesDiv.scrollHeight;
  return height - pos < threshold;
}

/**
 * Cuộn xuống cuối
 * @param {boolean} force - True để luôn cuộn, False để chỉ cuộn khi user ở gần cuối
 */
function scrollToBottom(force = false) {
  if (force || isUserNearBottom()) {
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  }
}

// === EVENT LISTENERS ===

// Gửi tin nhắn
sendBtn.onclick = sendMessage;
input.addEventListener("keypress", e => {
  if (e.key === "Enter" && !e.shiftKey) { // Gửi bằng Enter, xuống dòng bằng Shift+Enter
    e.preventDefault();
    sendMessage();
  }
});

// Nút Tạo ảnh (Yêu cầu 3)
generateImgBtn.onclick = () => {
  if (input.value.trim() === "") {
    input.value = "/taoanh ";
  } else if (!input.value.startsWith("/taoanh ") && !input.value.startsWith("/image ") && !input.value.startsWith("/imagine ")) {
    input.value = `/taoanh ${input.value}`;
  }
  input.focus();
};

// Chế độ Sáng/Tối
modeToggle.onclick = () => document.body.classList.toggle("light");

// Xử lý chọn ảnh (Giữ nguyên, nâng cấp)
imgBtn.onclick = () => fileInput.click();
fileInput.onchange = e => {
  Array.from(e.target.files).forEach(file => {
    const reader = new FileReader();
    reader.onload = (event) => {
      previewImage(file, event.target.result);
    };
    reader.readAsDataURL(file);
  });
  fileInput.value = ""; // Reset để có thể chọn lại file
};

// Xử lý dán ảnh (Giữ nguyên, nâng cấp)
document.addEventListener("paste", e => {
  if (e.clipboardData.files.length > 0) {
    e.preventDefault();
    Array.from(e.clipboardData.files).forEach(file => {
      if (file.type.startsWith("image/")) {
        const reader = new FileReader();
        reader.onload = (event) => {
          previewImage(file, event.target.result);
        };
        reader.readAsDataURL(file);
      }
    });
  }
});

// Info Modal Logic (Giữ nguyên)
infoBtn.onclick = () => infoModal.classList.add("show");
closeModal.onclick = () => infoModal.classList.remove("show");

// History Sidebar Logic (Mới)
historyBtn.onclick = () => historySidebar.classList.add("show");
closeHistoryModal.onclick = () => historySidebar.classList.remove("show");
newChatBtn.onclick = startNewChat;

// Đóng modal khi click bên ngoài
window.onclick = e => {
  if (e.target === infoModal) infoModal.classList.remove("show");
  if (e.target === historySidebar) historySidebar.classList.remove("show");
};

</script>
