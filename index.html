<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TTK AI DeepSeek Chat</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.3.1/css/bootstrap.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/github.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
<style>
body { font-family: Arial, sans-serif; margin:0; padding:0; background:#f5f5f5; }
#splashScreen { position:fixed; top:0; left:0; width:100%; height:100%; background:#007bff; color:white; display:flex; align-items:center; justify-content:center; font-size:2em; transition: opacity 0.5s; z-index:9999; }
#splashScreen.hidden { opacity:0; }
.container { max-width:600px; margin:20px auto; }
#messages { height:400px; overflow-y:auto; margin-bottom:10px; }
.message { display:flex; margin-bottom:10px; }
.message.user { justify-content:flex-end; }
.message.ai { justify-content:flex-start; }
.avatar { width:40px; height:40px; background:#ccc; border-radius:50%; margin:0 5px; flex-shrink:0; }
.bubble { max-width:70%; padding:10px; border-radius:10px; background:white; position:relative; transition: box-shadow 0.2s; }
.message.user .bubble { background:#dcf8c6; }
.bubble.glow { box-shadow: 0 0 20px rgba(0,123,255,0.5); }
.ai-spinner { display:flex; align-items:center; gap:5px; }
.ai-spinner .spinner { width:16px; height:16px; border:2px solid #ccc; border-top:2px solid #007bff; border-radius:50%; animation:spin 1s linear infinite; }
@keyframes spin { 0%{transform:rotate(0deg);} 100%{transform:rotate(360deg);} }
.image-preview { max-width:100px; max-height:100px; margin:5px; cursor:pointer; border:1px solid #ccc; border-radius:5px; }
#infoModal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); justify-content:center; align-items:center; }
#infoModal.show { display:flex; }
.modal-content { background:white; padding:20px; border-radius:10px; max-width:400px; width:80%; }
</style>
</head>
<body>

<div id="splashScreen">TTK AI DeepSeek</div>

<div class="container">
  <div id="messages"></div>
  <div class="form-group">
    <input type="text" id="input" class="form-control" placeholder="Nhập tin nhắn...">
  </div>
  <button id="send" class="btn btn-success">Gửi</button>
  <button id="imgBtn" class="btn btn-info">Chọn ảnh</button>
  <input type="file" id="fileInput" style="display:none" multiple accept="image/*">
  <button id="modeToggle" class="btn btn-secondary">Toggle Light</button>
  <button id="infoBtn" class="btn btn-warning">Info</button>
</div>

<div id="infoModal">
  <div class="modal-content">
    <h4>Thông tin</h4>
    <p>TTK AI DeepSeek Chatbot phiên bản demo.</p>
    <button id="closeModal" class="btn btn-danger">Đóng</button>
  </div>
</div>

<script>
// --- Splash ---
window.addEventListener("load", () => {
  const splash = document.getElementById("splashScreen");
  setTimeout(() => {
    splash.classList.add("hidden");
    setTimeout(() => {
      splash.style.display = "none";
      addMessage("Xin chào 👋! Mình là **TTK AI DeepSeek**, hãy gửi tin nhắn hoặc ảnh để mình giúp bạn nhé!", "ai");
    }, 800);
  }, 2000);
});

// --- API DeepSeek ---
const API_KEY = "sk-b724c5a5ce784f79bf2438f4eb16d7e8"; // Thay bằng key thật
const MODEL = "deepseek-chat";
const ENDPOINT = "https://api.deepseek.com/v1/chat/completions";

// --- Giao diện ---
const messagesDiv = document.getElementById("messages");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
const imgBtn = document.getElementById("imgBtn");
const fileInput = document.getElementById("fileInput");
const modeToggle = document.getElementById("modeToggle");
let selectedImages = [];

// Hiển thị tin nhắn Markdown
function renderMessageContent(text) {
  const c = document.createElement("div");
  c.innerHTML = marked.parse(text);
  c.querySelectorAll("pre code").forEach(el => hljs.highlightElement(el));
  return c;
}

// Thêm tin nhắn
function addMessage(text, sender, isTyping = false, imgs = []) {
  const msg = document.createElement("div");
  msg.className = `message ${sender}`;
  const avatar = document.createElement("div");
  avatar.className = "avatar";
  msg.appendChild(avatar);

  const bubble = document.createElement("div");
  bubble.className = "bubble";

  imgs.forEach(src => {
    const i = document.createElement("img");
    i.src = src;
    i.className = "image-preview";
    i.onclick = () => {
      selectedImages = selectedImages.filter(s => s !== src);
      i.remove();
    };
    bubble.appendChild(i);
  });

  if (isTyping && sender === "ai") {
    const spin = document.createElement("div");
    spin.className = "ai-spinner";
    spin.innerHTML = '<div class="spinner"></div><span>TTK AI đang gõ...</span>';
    bubble.appendChild(spin);
  } else {
    bubble.appendChild(renderMessageContent(text));
  }

  msg.appendChild(bubble);
  messagesDiv.appendChild(msg);
  messagesDiv.scrollTop = messagesDiv.scrollHeight;
  return msg;
}

// Hover glow
document.addEventListener("mousemove", e => {
  document.querySelectorAll(".bubble").forEach(b => {
    const r = b.getBoundingClientRect(),
          cx = e.clientX - (r.left + r.width/2),
          cy = e.clientY - (r.top + r.height/2),
          d = Math.sqrt(cx*cx + cy*cy);
    if(d<150) b.classList.add("glow"); else b.classList.remove("glow");
    b.style.setProperty("--shineX", `${cx}px`);
    b.style.setProperty("--shineY", `${cy}px`);
  });
});

// Chọn ảnh
imgBtn.onclick = () => fileInput.click();
fileInput.onchange = e => {
  Array.from(e.target.files).forEach(f => {
    const r = new FileReader();
    r.onload = () => {
      selectedImages.push(r.result);
      addMessage("", "user", false, [r.result]);
    };
    r.readAsDataURL(f);
  });
};

// Dán ảnh
document.addEventListener("paste", e => {
  for(const item of e.clipboardData.items){
    if(item.type.indexOf("image")!==-1){
      const f = item.getAsFile();
      const r = new FileReader();
      r.onload = ()=>{ selectedImages.push(r.result); addMessage("", "user", false,[r.result]); };
      r.readAsDataURL(f);
    }
  }
});

// --- Gửi tin nhắn ---
async function sendMessage() {
  const text = input.value.trim();
  if(!text && selectedImages.length===0) return;
  addMessage(text || "📷 Ảnh","user",false,selectedImages);
  input.value="";
  const typing = addMessage("", "ai", true);

  try{
    const msgs = [
      { role:"system", content:"Bạn là trợ lý AI DeepSeek thân thiện, thông minh và có khả năng phân tích hình ảnh." }
    ];
    selectedImages.forEach(img=>msgs.push({ role:"user", content:"Phân tích hình ảnh: "+img }));
    if(text) msgs.push({ role:"user", content:text });

    const res = await fetch(ENDPOINT,{
      method:"POST",
      headers:{ "Authorization":`Bearer ${API_KEY}`, "Content-Type":"application/json" },
      body: JSON.stringify({ model:MODEL, messages:msgs })
    });

    const data = await res.json();
    typing.remove();
    const reply = data?.choices?.[0]?.message?.content || "⚠️ Không có phản hồi từ AI.";
    addMessage(reply,"ai");
  }catch(e){
    typing.remove();
    addMessage("❌ Lỗi kết nối hoặc API Key không hợp lệ.","ai");
  }

  selectedImages=[];
}

sendBtn.onclick = sendMessage;
input.addEventListener("keypress", e => { if(e.key==="Enter") sendMessage(); });
modeToggle.onclick = ()=>document.body.classList.toggle("light");

// Modal info
const infoBtn=document.getElementById("infoBtn"),
      infoModal=document.getElementById("infoModal"),
      closeModal=document.getElementById("closeModal");
infoBtn.onclick=()=>infoModal.classList.add("show");
closeModal.onclick=()=>infoModal.classList.remove("show");
window.onclick=e=>{ if(e.target===infoModal) infoModal.classList.remove("show"); };
</script>
</body>
</html>
